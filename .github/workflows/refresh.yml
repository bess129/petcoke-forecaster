# Daily refresh: fetch Google News, score new headlines with Claude, write the
# supply-shortage outlook, and save
# data/news.csv, data/signals.csv and data/outlook.json back to this repository. Streamlit Cloud
# notices the change and the online dashboard shows the new signals.
name: Daily news & Claude signal refresh

on:
  schedule:
    - cron: "17 23 * * *"     # 23:17 UTC = 07:17 Singapore time, every day
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # allow the job to save the updated CSVs

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the few packages the scraper and detector need
        run: pip install pandas feedparser anthropic

      - name: Fetch news
        run: python scraper.py

      - name: Score new headlines with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python signal_detector.py

      - name: Write the Claude supply-shortage outlook
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python outlook.py

      - name: Save updated data back to the repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.csv data/signals.csv data/outlook.json
          if git diff --cached --quiet; then
            echo "No new headlines today."
          else
            git commit -m "Daily news & signal refresh"
            git push
          fi
